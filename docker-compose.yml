version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: crud-gopher-db
    restart: always
    environment:
      - POSTGRES_USER=gopher
      - POSTGRES_PASSWORD=gopher
      - POSTGRES_DB=crud_gopher
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
